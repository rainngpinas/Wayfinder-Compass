name: WayfinderCompass
version: 2.0.0
main: dev.wayfinder.WayfinderPlugin
api-version: '26.3'
author: Custom
description: Menu-driven navigation waypoints for Paper servers with Java and Geyser Bedrock support.
commands:
  wp:
    description: Open the Wayfinder menu.
    usage: /wp
    aliases: [wayfinder, waypoint]
    permission: wayfinder.use
permissions:
  wayfinder.use:
    description: Open Wayfinder and manage your own waypoints.
    default: true
  wayfinder.admin:
    description: Manage all waypoints.
    default: op
